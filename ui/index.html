<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clarity Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1d2330;
    --fg: #e7e9ee;
    --muted: #8b93a7;
    --accent: #7aa2f7;
    --added: #9ece6a;
    --removed: #f7768e;
    --changed: #e0af68;
    --border: #272c3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 16px; }
  header h1 { margin: 0; font-size: 18px; color: var(--accent); }
  header .subtitle { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--panel); }
  nav button { background: none; border: none; color: var(--muted); padding: 12px 20px; cursor: pointer; font-family: inherit; font-size: 14px; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--fg); border-bottom-color: var(--accent); }
  main { padding: 24px; max-width: 1400px; }
  .tab { display: none; }
  .tab.active { display: block; }
  .row { display: grid; grid-template-columns: 320px 1fr; gap: 24px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; }
  .panel h2 { margin: 0 0 12px 0; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  ul.packet-list { list-style: none; padding: 0; margin: 0; }
  ul.packet-list li { padding: 10px 12px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 6px; cursor: pointer; background: var(--panel-2); }
  ul.packet-list li:hover { border-color: var(--accent); }
  ul.packet-list li.selected { border-color: var(--accent); background: #1f2a44; }
  .sha { color: var(--muted); font-size: 11px; }
  .mission { font-size: 13px; margin-top: 4px; }
  pre { background: var(--panel-2); border: 1px solid var(--border); padding: 12px; border-radius: 4px; overflow: auto; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  button.primary, button.secondary { font-family: inherit; font-size: 13px; padding: 8px 14px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border); }
  button.primary { background: var(--accent); color: #0f1115; border-color: var(--accent); }
  button.secondary { background: var(--panel-2); color: var(--fg); }
  button.primary:hover, button.secondary:hover { opacity: 0.9; }
  .empty { color: var(--muted); font-style: italic; padding: 24px; text-align: center; }
  .error { color: var(--removed); }
</style>
</head>
<body>
<header>
  <h1>Clarity Engine</h1>
  <div class="subtitle">Intent → Context Packet compiler</div>
</header>
<nav>
  <button class="tab-btn active" data-tab="browser">Browser</button>
  <button class="tab-btn" data-tab="diff">Diff</button>
</nav>
<main>
  <section id="tab-browser" class="tab active">
    <div class="row">
      <div class="panel">
        <h2>Registered Packets <button class="secondary" id="refresh" style="float:right;padding:4px 10px">↻</button></h2>
        <ul class="packet-list" id="packet-list"><li class="empty">Loading…</li></ul>
      </div>
      <div class="panel">
        <h2>Detail</h2>
        <div id="detail"><div class="empty">Select a packet to view its manifest and markdown.</div></div>
      </div>
    </div>
  </section>

  <section id="tab-diff" class="tab">
    <div class="row" style="grid-template-columns: 1fr 1fr;">
      <div class="panel">
        <h2>Left (sha or JSON manifest)</h2>
        <textarea id="diff-left" style="width:100%;height:180px;background:var(--panel-2);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:8px;font-family:inherit;font-size:12px;" placeholder='e.g. c8d89234… or {"mission": "…", …}'></textarea>
      </div>
      <div class="panel">
        <h2>Right (sha or JSON manifest)</h2>
        <textarea id="diff-right" style="width:100%;height:180px;background:var(--panel-2);color:var(--fg);border:1px solid var(--border);border-radius:4px;padding:8px;font-family:inherit;font-size:12px;" placeholder='e.g. 0e8d952… or inline manifest JSON'></textarea>
      </div>
    </div>
    <div style="margin-top:12px;">
      <button class="primary" id="diff-run">Compute diff</button>
      <span id="diff-status" style="color:var(--muted);margin-left:12px;"></span>
    </div>
    <div class="panel" style="margin-top:16px;">
      <h2>Result</h2>
      <div id="diff-result"><div class="empty">Provide two sides and click "Compute diff".</div></div>
    </div>
  </section>
</main>
<script>
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let parsed; try { parsed = JSON.parse(text); } catch { parsed = text; }
  if (!res.ok) throw { status: res.status, body: parsed };
  return parsed;
}

function tabSwitcher() {
  $$('.tab-btn').forEach(btn => btn.addEventListener('click', () => {
    $$('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    $$('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + btn.dataset.tab));
  }));
}

let selectedSha = null;

async function loadPackets() {
  const list = $('#packet-list');
  list.innerHTML = '<li class="empty">Loading…</li>';
  try {
    const { packets } = await api('GET', '/packets');
    if (!packets.length) {
      list.innerHTML = '<li class="empty">No packets registered yet.</li>';
      return;
    }
    list.innerHTML = '';
    for (const p of packets) {
      const li = document.createElement('li');
      if (p.context_sha === selectedSha) li.classList.add('selected');
      li.innerHTML = `<div class="sha">${p.context_sha.slice(0, 16)}…</div><div class="mission">${escapeHtml(p.mission || '(no mission)')}</div>`;
      li.addEventListener('click', () => selectPacket(p.context_sha));
      list.appendChild(li);
    }
  } catch (err) {
    list.innerHTML = `<li class="empty error">Failed to load: ${err.status || err}</li>`;
  }
}

async function selectPacket(sha) {
  selectedSha = sha;
  $$('#packet-list li').forEach(li => li.classList.remove('selected'));
  try {
    const packet = await api('GET', '/packets/' + sha);
    $('#detail').innerHTML = `
      <div><strong>context_sha:</strong> <code>${sha}</code></div>
      <h3 style="margin-top:16px">Manifest</h3>
      <pre>${escapeHtml(JSON.stringify(packet.manifest, null, 2))}</pre>
      <h3>Rendered Markdown</h3>
      <pre>${escapeHtml(packet.packet_md)}</pre>
    `;
  } catch (err) {
    $('#detail').innerHTML = `<div class="error">Load failed: ${err.status || err}</div>`;
  }
  loadPackets();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function parseSide(value) {
  const trimmed = value.trim();
  if (!trimmed) throw new Error('empty');
  if (/^[a-f0-9]{64}$/.test(trimmed)) return trimmed;
  try { return JSON.parse(trimmed); } catch { throw new Error('input is neither a 64-char sha nor valid JSON'); }
}

function renderDiff(diff) {
  const wrap = document.createElement('div');
  const section = (title, color, entries, renderEntry) => {
    const h = document.createElement('h3');
    h.textContent = `${title} (${entries.length})`;
    h.style.color = color;
    h.style.margin = '12px 0 6px';
    wrap.appendChild(h);
    if (!entries.length) { const p = document.createElement('div'); p.className = 'empty'; p.textContent = 'none'; wrap.appendChild(p); return; }
    for (const [key, val] of entries) {
      const pre = document.createElement('pre');
      pre.textContent = renderEntry(key, val);
      wrap.appendChild(pre);
    }
  };
  section('Added', 'var(--added)', Object.entries(diff.added), (k, v) => `${k}: ${JSON.stringify(v, null, 2)}`);
  section('Removed', 'var(--removed)', Object.entries(diff.removed), (k, v) => `${k}: ${JSON.stringify(v, null, 2)}`);
  section('Changed', 'var(--changed)', Object.entries(diff.changed), (k, v) => `${k}:\n- before: ${JSON.stringify(v.before, null, 2)}\n+ after:  ${JSON.stringify(v.after, null, 2)}`);
  return wrap;
}

async function runDiff() {
  const status = $('#diff-status');
  const out = $('#diff-result');
  status.textContent = 'Computing…';
  out.innerHTML = '';
  try {
    const left = parseSide($('#diff-left').value);
    const right = parseSide($('#diff-right').value);
    const diff = await api('POST', '/packets/diff', { left, right });
    status.textContent = '';
    out.innerHTML = '';
    out.appendChild(renderDiff(diff));
  } catch (err) {
    status.textContent = '';
    out.innerHTML = `<div class="error">${escapeHtml(err.message || JSON.stringify(err))}</div>`;
  }
}

tabSwitcher();
$('#refresh').addEventListener('click', loadPackets);
$('#diff-run').addEventListener('click', runDiff);
loadPackets();
</script>
</body>
</html>
