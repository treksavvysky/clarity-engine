name: CI

on:
  push:
  pull_request:

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (if present)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found; skipping dependency installation."
          fi

      - name: Import FastAPI app
        run: python -c "from app.main import app; assert app is not None"

      - name: Run tests
        run: pytest -q

      - name: Run focused Raw Intent registry and API tests
        run: pytest -q tests/test_intent_registry.py tests/test_app_intent_endpoints.py tests/test_docker_compose.py

      - name: Lint example context packet manifest
        run: python tools/lint_packet.py packets/examples/context_packet_example.json

      - name: Compose packet from example manifest
        run: python tools/compose_packet.py packets/examples/context_packet_example.json

      - name: Lint example raw intent packet
        run: python tools/raw_intent_packet.py lint packets/examples/raw_intent_packet_example.json

      - name: Compose raw intent packet from example manifest
        run: python tools/raw_intent_packet.py compose packets/examples/raw_intent_packet_example.json --output-dir /tmp/raw-intent-packet
