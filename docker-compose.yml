# Clarity Engine service container.
#
#   docker compose up -d --build
#   curl http://localhost:8010/healthz
#
# Production defaults mount packets/registry/ for content persistence.
# Development-specific settings (e.g. host bind mount and codejourney-proxy)
# are provided via docker-compose.override.yml (gitignored).
services:
  clarity-engine:
    build: .
    image: clarity-engine
    container_name: clarity-engine
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - ./packets/registry:/app/packets/registry
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

