# Clarity Engine as a dev container.
#
#   docker compose up -d --build
#   curl http://localhost:8010/healthz
#
# Source is bind-mounted so uvicorn --reload picks up edits made on the
# host; the registry (packets/registry/, gitignored) persists there too
# since it's inside the mounted tree.
#
# Joined to the codejourney-proxy network so sibling containers (Mnemos)
# can reach it at http://clarity-engine:8000. No public vhost — add a proxy
# entry if it ever needs to be exposed.
services:
  clarity-engine:
    build: .
    image: clarity-engine
    container_name: clarity-engine
    restart: unless-stopped
    ports:
      - "8010:8000"
    volumes:
      - .:/app
    networks:
      - codejourney-proxy

networks:
  codejourney-proxy:
    external: true
