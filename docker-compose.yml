services:
  clarity-engine:
    build: .
    user: "${CLARITY_UID:-1000}:${CLARITY_GID:-1000}"
    ports:
      - "8010:8000"
    volumes:
      - ./packets/registry:/app/packets/registry
      - ./packets/intents:/app/packets/intents
      - ./packets/links:/app/packets/links
      - ./packets/proposals:/app/packets/proposals
    environment:
      CLARITY_REGISTRY_ROOT: /app/packets/registry
      CLARITY_INTENT_REGISTRY_ROOT: /app/packets/intents
      CLARITY_INTENT_LINK_ROOT: /app/packets/links/intent-missions
      CLARITY_PROPOSAL_REGISTRY_ROOT: /app/packets/proposals
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
